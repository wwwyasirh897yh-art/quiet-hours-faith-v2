def split_sentences(text):
    parts = re.split(r"(?<=[.!?])\s+", clean_text(text))
    return [p for p in parts if p]


def group_chunks(sentences, max_words=26):
    chunks, cur = [], []
    for sen in sentences:
        if cur and len(" ".join(cur + [sen]).split()) > max_words:
            chunks.append(" ".join(cur))
            cur = [sen]
        else:
            cur.append(sen)
    if cur:
        chunks.append(" ".join(cur))
    return chunks


def generate_story(ref, verse_text, words):
    """Claude API se verse ke mutabiq chhoti kahani. Fail ho to None."""
    if not ANTHROPIC_API_KEY:
        return None
    prompt = (
        f"Bible verse ({ref}, KJV): {verse_text}\n\n"
        f"Write a short, warm, original story of about {words} words that illustrates this verse, "
        "for a YouTube Short aimed at people aged 50 and older in the USA.\n"
        "Rules:\n"
        "- Start with a hook in the first sentence that makes the viewer want to keep listening.\n"
        "- Characters in their 50s to 80s (a widow, a retired teacher, a grandfather, a nurse, etc.), "
        "real life situations: loneliness, worry about money, health, family distance, retirement, grief, gratitude.\n"
        "- Simple spoken English, short sentences, no emojis, no hashtags, no headings.\n"
        "- It is a fictional story: do not claim it is true, and make no medical, financial or miracle-cure promises.\n"
        "- End with one gentle line that ties back to the verse and encourages the listener.\n"
        "- Also write a click-worthy YouTube title under 55 characters that speaks to people over 50.\n"
        'Reply with JSON only, exactly like: {"title": "...", "story": "..."}'
    )
    try:
        r = requests.post(
            "https://api.anthropic.com/v1/messages",
            headers={"x-api-key": ANTHROPIC_API_KEY, "anthropic-version": "2023-06-01",
                     "content-type": "application/json"},
            json={"model": STORY_MODEL, "max_tokens": 700,
                  "messages": [{"role": "user", "content": prompt}]},
            timeout=90)
        r.raise_for_status()
        raw = r.json()["content"][0]["text"].strip()
        raw = raw.replace("```json", "").replace("```", "").strip()
        data = json.loads(raw)
        title, story = data["title"].strip(), data["story"].strip()
        if title and len(story.split()) >= 25:
            return title, story
    except Exception as e:
        print("Story API error:", e)
    return None


def build_story_items(ref, verse_text, target, lo, hi, folder):
    """Story ko chunks mein tod kar awaaz banata hai, duration lo..hi (sec) ke andar rakhta hai."""
    words = max(25, int(target * WORDS_PER_SEC))
    fallbacks = random.sample(FALLBACK_STORIES, len(FALLBACK_STORIES))
    best = None
    for attempt in range(3):
        res = generate_story(ref, verse_text, words) or fallbacks[attempt % len(fallbacks)]
        title, text = res
        items, voice = [], 0.0
        for i, chunk in enumerate(group_chunks(split_sentences(text))):
            mp3 = os.path.join(folder, f"s{attempt}_{i}.mp3")
            tts_to_file(chunk, mp3)
            dur = media_duration(mp3)
            items.append({"text": chunk, "ref": "A Short Story", "kind": "story",
                          "mp3": mp3, "dur": dur, "gap": GAP_SEC})
            voice += dur + GAP_SEC
        best = (title, items, voice)
        if lo <= voice <= hi:
            return best
        words = max(25, int(words * target / max(voice, 1)))
    return best


# --------------------------------------------------------------------------
# Background video (Pixabay)
# --------------------------------------------------------------------------
def download_background(path):
    for _ in range(5):
        q = random.choice(BG_QUERIES)
        try:
            r = requests.get("https://pixabay.com/api/videos/",
                             params={"key": PIXABAY_API_KEY, "q": q, "per_page": 50,
                                     "safesearch": "true"}, timeout=30)
            hits = r.json().get("hits", [])
        except Exception as e:
            print("Pixabay error:", e)
            continue
        random.shuffle(hits)
        for h in hits:
            vids = h.get("videos", {})
            for size in ("large", "medium", "small"):
                url = vids.get(size, {}).get("url")
                if url:
                    try:
                        with requests.get(url, stream=True, timeout=60) as resp:
                            resp.raise_for_status()
                            with open(path, "wb") as f:
                                for chunk in resp.iter_content(1 << 20):
                                    f.write(chunk)
                        if os.path.getsize(path) > 100000:
                            return True
                    except Exception as e:
                        print("Download error:", e)
                    break
    return False


# --------------------------------------------------------------------------
# Text overlay (verse card)
# --------------------------------------------------------------------------
def wrap(draw, text, font, max_w):
    words, lines, cur = text.split(), [], ""
    for w in words:
        test = (cur + " " + w).strip()
        if draw.textlength(test, font=font) <= max_w:
            cur = test
        else:
            lines.append(cur)
            cur = w
    if cur:
        lines.append(cur)
    return lines


def verse_overlay(text, ref, path):
    img = Image.new("RGBA", (W, H), (0, 0, 0, 0))
    d = ImageDraw.Draw(img)
    max_w = W - 220
    size = 60
    while size > 34:
        font = ImageFont.truetype(FONT_BOLD, size)
        lines = wrap(d, text, font, max_w)
        if len(lines) * int(size * 1.4) <= 820:
            break
        size -= 2
    font = ImageFont.truetype(FONT_BOLD, size)
    ref_font = ImageFont.truetype(FONT_REG, 42)
    lh = int(size * 1.4)
    block_h = len(lines) * lh + 90
    top = (H - block_h) // 2 - 40
    d.rounded_rectangle((70, top - 50, W - 70, top + block_h + 40), radius=40, fill=(0, 0, 0, 150))
    y = top
    for ln in lines:
        w = d.textlength(ln, font=font)
        d.text(((W - w) / 2 + 2, y + 2), ln, font=font, fill=(0, 0, 0, 255))
        d.text(((W - w) / 2, y), ln, font=font, fill=(255, 255, 255, 255))
        y += lh
    w = d.textlength(ref, font=ref_font)
    d.text(((W - w) / 2, y + 20), ref, font=ref_font, fill=(255, 214, 102, 255))
    img.save(path)


# --------------------------------------------------------------------------
# Outro animation: Subscribe button + click + bell ring
# --------------------------------------------------------------------------
OW, OH = W, 900   # outro frame ka size (screen ke beech mein lagta hai)


def ease_out(x):
    x = max(0.0, min(1.0, x))
    return 1 - (1 - x) ** 3


def bell_image(angle):
    b = Image.new("RGBA", (220, 220), (0, 0, 0, 0))
    d = ImageDraw.Draw(b)
    white = (255, 255, 255, 255)
    d.ellipse((105, 18, 115, 28), fill=white)                      # upar ka chhota ghera
    d.pieslice((50, 28, 170, 148), 180, 360, fill=white)           # gumbad
    d.polygon([(50, 88), (170, 88), (195, 160), (25, 160)], fill=white)   # jism
    d.rounded_rectangle((20, 155, 200, 172), radius=8, fill=white)        # kinara
    d.ellipse((95, 168, 125, 198), fill=white)                     # clapper
    return b.rotate(angle, center=(110, 24), resample=Image.BICUBIC)


def outro_frame(t):
    img = Image.new("RGBA", (OW, OH), (0, 0, 0, 0))
    d = ImageDraw.Draw(img)
    fade = ease_out(t / 0.4)
    d.rounded_rectangle((60, 40, OW - 60, OH - 40), radius=50, fill=(0, 0, 0, int(170 * fade)))

    f_big = ImageFont.truetype(FONT_BOLD, 54)
    f_mid = ImageFont.truetype(FONT_BOLD, 52)
    f_small = ImageFont.truetype(FONT_REG, 40)

    a = int(255 * fade)
    for txt, font, yy, col in (
        ("Subscribe  •  Like  •  Share", f_big, 130, (255, 255, 255, a)),
        ("with your loved ones", f_small, 225, (255, 214, 102, a)),
    ):
        w = d.textlength(txt, font=font)
        d.text(((OW - w) / 2, yy), txt, font=font, fill=col)

    # Button
    t_press = 2.4                       # click ka waqt
    subscribed = t >= t_press + 0.2
    pulse = 1.0
    if not subscribed:
        pulse = 1.0 + 0.04 * math.sin(t * 8)
    if t_press <= t < t_press + 0.2:
        pulse = 0.93                    # dabne ka effect
    bw, bh = int(520 * pulse), int(130 * pulse)
    cx, cy = OW // 2 - 70, 470
    box = (cx - bw // 2, cy - bh // 2, cx + bw // 2, cy + bh // 2)
    if subscribed:
        d.rounded_rectangle(box, radius=bh // 2, fill=(90, 90, 90, 255))
        label = "SUBSCRIBED ✓"
    else:
        d.rounded_rectangle(box, radius=bh // 2, fill=(230, 20, 20, 255))
        label = "SUBSCRIBE"
    w = d.textlength(label, font=f_mid)
    d.text((cx - w / 2, cy - 34), label, font=f_mid, fill=(255, 255, 255, 255))

    # Bell (button ke saath, click ke baad ring hoti hai)
    bx, by = cx + 260 + 40, cy - 100
    if subscribed:
        tb = t - (t_press + 0.2)
        if tb < 0.3:
            s = ease_out(tb / 0.3)
            bell = bell_image(0).resize((int(220 * s) or 1, int(220 * s) or 1))
            img.paste(bell, (bx + (220 - bell.width) // 2, by + (220 - bell.height) // 2), bell)
        else:
            ang = 22 * math.sin(tb * 18) * math.exp(-0.35 * (tb - 0.3))
            bell = bell_image(ang)
            img.paste(bell, (bx, by), bell)
            # chhote "ring" arc
            if int(tb * 6) % 2 == 0:
                d.arc((bx - 14, by + 30, bx + 234, by + 190), 150, 210, fill=(255, 214, 102, 255), width=8)
                d.arc((bx - 14, by + 30, bx + 234, by + 190), -30, 30, fill=(255, 214, 102, 255), width=8)
        w = d.textlength("Tap the bell", font=f_small)
        d.text(((OW - w) / 2, cy + 130), "Tap the bell", font=f_small, fill=(255, 255, 255, a))

    # Cursor / ungli (click se pehle button ki taraf aati hai)
    if t < t_press + 0.6:
        k = ease_out((t - 1.4) / 1.0) if t > 1.4 else 0
        sx, sy = OW - 180, cy + 330
        px = sx + (cx + 120 - sx) * k
        py = sy + (cy + 20 - sy) * k
        if t > 1.4:
            d.ellipse((px - 34, py - 34, px + 34, py + 34), fill=(255, 255, 255, 220),
                      outline=(0, 0, 0, 255), width=4)
        if t_press <= t < t_press + 0.5:
            r = 40 + (t - t_press) * 160
            d.ellipse((cx + 120 - r, cy + 20 - r, cx + 120 + r, cy + 20 + r),
                      outline=(255, 255, 255, int(200 * (1 - (t - t_press) / 0.5))), width=5)

    # Channel naam
    name = "Quiet Hours of Faith"
    w = d.textlength(name, font=f_mid)
    d.text(((OW - w) / 2, OH - 190), name, font=f_mid, fill=(255, 214, 102, a))
    return img


def make_outro_frames(folder):
    os.makedirs(folder, exist_ok=True)
    n = int(OUTRO_SEC * OUTRO_FPS)
    for i in range(n):
        outro_frame(i / OUTRO_FPS).save(os.path.join(folder, f"f_{i:03d}.png"))
    return n


# --------------------------------------------------------------------------
# Audio
# --------------------------------------------------------------------------
def make_silence(path, sec):
    run(["ffmpeg", "-y", "-f", "lavfi", "-i", "anullsrc=r=44100:cl=mono",
         "-t", f"{sec:.3f}", path])


def to_wav(src, dst, trim=None):
    cmd = ["ffmpeg", "-y", "-i", src, "-ar", "44100", "-ac", "1"]
    if trim:
        cmd += ["-t", f"{trim:.3f}"]
    run(cmd + [dst])


def build_audio(chosen, total, folder):
    parts = []
    s_lead = os.path.join(folder, "s_lead.wav"); make_silence(s_lead, LEAD_SEC)
    s_tail = os.path.join(folder, "s_tail.wav"); make_silence(s_tail, TAIL_SEC)
    parts.append(s_lead)
    for i, v in enumerate(chosen):
        w = os.path.join(folder, f"v{i}.wav")
        to_wav(v["mp3"], w)
        sg = os.path.join(folder, f"gap_{int(v['gap'] * 1000)}.wav")
        if not os.path.exists(sg):
            make_silence(sg, v["gap"])
        parts += [w, sg]
    parts.append(s_tail)

    # Outro awaaz
    o_mp3 = os.path.join(folder, "outro.mp3")
    tts_to_file("Subscribe, like, and share with your loved ones. Tap the bell.", o_mp3, rate="+0%")
    o_wav = os.path.join(folder, "outro.wav")
    to_wav(o_mp3, o_wav, trim=OUTRO_SEC - 0.2)
    parts.append(o_wav)

    lst = os.path.join(folder, "list.txt")
    with open(lst, "w") as f:
        for p in parts:
            f.write(f"file '{os.path.abspath(p)}'\n")
    voice = os.path.join(folder, "voice.wav")
    run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", lst, "-c", "copy", voice])

    final = os.path.join(folder, "audio.wav")
    if os.path.exists(MUSIC_FILE):
        run(["ffmpeg", "-y", "-i", voice, "-stream_loop", "-1", "-i", MUSIC_FILE,
             "-filter_complex",
             "[1:a]volume=0.12[m];[0:a][m]amix=inputs=2:duration=first:dropout_transition=0[a]",
             "-map", "[a]", "-t", f"{total:.3f}", final])
    else:
        run(["ffmpeg", "-y", "-i", voice, "-af", "apad", "-t", f"{total:.3f}", final])
    return final


# --------------------------------------------------------------------------
# Video render
# --------------------------------------------------------------------------
def render_video(chosen, total, folder, out_path):
    bg = os.path.join(folder, "bg.mp4")
    if not download_background(bg):
        raise RuntimeError("Pixabay se background nahi mila")

    audio = build_audio(chosen, total, folder)

    # Har verse ka overlay PNG aur uska time window
    overlays, t = [], LEAD_SEC
    for i, v in enumerate(chosen):
        p = os.path.join(folder, f"ov{i}.png")
        verse_overlay(v["text"], v["ref"], p)
        end = t + v["dur"] + v["gap"]
        overlays.append((p, t - 0.05, end))
        t = end
    t_outro = t + TAIL_SEC

    frames_dir = os.path.join(folder, "outro_frames")
    make_outro_frames(frames_dir)

    cmd = ["ffmpeg", "-y", "-stream_loop", "-1", "-i", bg, "-i", audio]
    for p, _, _ in overlays:
        cmd += ["-i", p]
    cmd += ["-framerate", str(OUTRO_FPS), "-i", os.path.join(frames_dir, "f_%03d.png")]
    outro_idx = 2 + len(overlays)

    fc = (f"[0:v]scale={W}:{H}:force_original_aspect_ratio=increase,crop={W}:{H},"
          f"setsar=1,fps={FPS},eq=brightness=-0.10[b0]")
    last = "b0"
    for i, (_, a, b) in enumerate(overlays):
        fc += (f";[{last}][{2 + i}:v]overlay=0:0:enable='between(t,{a:.2f},{b:.2f})'[b{i + 1}]")
        last = f"b{i + 1}"
    fc += (f";[{outro_idx}:v]format=rgba,setpts=PTS+{t_outro:.3f}/TB[ou]"
           f";[{last}][ou]overlay=0:{(H - OH) // 2}:eof_action=pass[v]")

    cmd += ["-filter_complex", fc, "-map", "[v]", "-map", "1:a",
            "-t", f"{total:.3f}", "-c:v", "libx264", "-preset", "veryfast", "-crf", "22",
            "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "160k", "-movflags", "+faststart",
            out_path]
    run(cmd)
    print(f"Video tayyar: {out_path} ({media_duration(out_path):.1f} sec)")


# --------------------------------------------------------------------------
# YouTube upload + schedule
# --------------------------------------------------------------------------
def youtube_client():
    data = json.loads(CLIENT_SECRET_JSON)
    info = data.get("installed") or data.get("web")
    creds = Credentials(
        token=None,
        refresh_token=REFRESH_TOKEN,
        token_uri=info.get("token_uri", "https://oauth2.googleapis.com/token"),
        client_id=info["client_id"],
        client_secret=info["client_secret"],
        scopes=["https://www.googleapis.com/auth/youtube.upload"],
    )
    return build("youtube", "v3", credentials=creds)


def next_slots(count, already):
    """SLOT_HOURS_UTC ke agle khaali waqt (abhi se kam az kam 30 min baad)."""
    now = datetime.datetime.utcnow() + datetime.timedelta(minutes=30)
    slots, day = [], now.date()
    while len(slots) < count:
        for h in sorted(SLOT_HOURS_UTC):
            dt = datetime.datetime(day.year, day.month, day.day, h, 0, 0)
            iso = dt.strftime("%Y-%m-%dT%H:%M:%SZ")
            if dt > now and iso not in already:
                slots.append(iso)
                if len(slots) == count:
                    break
        day += datetime.timedelta(days=1)
    return slots


def upload(youtube, path, title, desc, publish_at):
    body = {
        "snippet": {"title": title[:100], "description": desc[:4900],
                    "tags": ["Psalms", "Bible", "Faith", "Prayer", "KJV", "Shorts", "Christian story"],
                    "categoryId": "22"},
        "status": {"privacyStatus": "private", "publishAt": publish_at,
                   "selfDeclaredMadeForKids": False},
    }
    media = MediaFileUpload(path, mimetype="video/mp4", resumable=True)
    req = youtube.videos().insert(part="snippet,status", body=body, media_body=media)
    resp = None
    while resp is None:
        _, resp = req.next_chunk()
    print(f"Upload ho gayi: {resp['id']} -> {publish_at}")
    return resp["id"]


# --------------------------------------------------------------------------
# Main
# --------------------------------------------------------------------------
def make_short(i, chapters, used):
    """Verse(s) + story chun kar items, total duration aur title wapas karta hai."""
    folder = os.path.join(WORK, f"short_{i}")
    os.makedirs(folder, exist_ok=True)
    fixed_base = LEAD_SEC + TAIL_SEC + OUTRO_SEC

    for attempt in range(12):
        ch = chapters[i % TOPIC_COUNT] if attempt == 0 else random.randint(1, 150)
        verses = fetch_chapter(ch)
        if not verses:
            continue
        starts = list(range(len(verses)))
        random.shuffle(starts)
        for st in starts[:6]:
            verse_items, verse_voice = pick_verses(verses, st, used, folder)
            if not verse_items:
                continue
            fixed = fixed_base + verse_voice
            if MAX_SEC - fixed < 12:        # story ke liye jagah hi nahi
                continue
            ref = verse_items[0]["ref"]
            if len(verse_items) > 1:
                ref += f"-{verse_items[-1]['v']}"
            verse_text = " ".join(v["text"] for v in verse_items)
            title, story_items, story_voice = build_story_items(
                ref, verse_text, TARGET_SEC - fixed, MIN_SEC - fixed, MAX_SEC - fixed, folder)

            # Agar abhi bhi MAX se lambi ho to aakhri chunks kaat do (kam az kam 1 rakho)
            while len(story_items) > 1 and fixed + story_voice > MAX_SEC:
                last = story_items.pop()
                story_voice -= last["dur"] + last["gap"]
            total = fixed + story_voice
            if total > MAX_SEC or total < MIN_SEC - 4:
                continue
            return folder, verse_items + story_items, total, title, ref, verse_text, story_items
    raise RuntimeError("Munasib verse + story nahi mili")


def main():
    if not (PIXABAY_API_KEY and CLIENT_SECRET_JSON and REFRESH_TOKEN):
        print("Secrets missing hain (PIXABAY_API_KEY / CLIENT_SECRET_JSON / REFRESH_TOKEN)")
        sys.exit(1)
    if not ANTHROPIC_API_KEY:
        print("Note: ANTHROPIC_API_KEY nahi mili, built-in stories use hongi")

    os.makedirs(WORK, exist_ok=True)
    used = set(load_json(USED_FILE, []))
    schedule = load_json(SCHEDULE_FILE, [])
    already = {s.get("publish_at") for s in schedule}
    slots = next_slots(TOTAL_SHORTS, already)
    youtube = youtube_client()

    chapters = random.sample(range(1, 151), TOPIC_COUNT)
    failures = 0

    for i, slot in enumerate(slots):
        try:
            folder, items, total, title, ref, verse_text, story_items = make_short(i, chapters, used)
            story_text = " ".join(x["text"] for x in story_items)
            print(f"[{i + 1}/{len(slots)}] {ref} | {title} (andaza {total:.1f} sec)")

            out = os.path.join(folder, "short.mp4")
            render_video(items, total, folder, out)

            full_title = f"{title} | {ref} #Shorts"
            if len(full_title) > 100:
                full_title = f"{title} #Shorts"
            desc = (f"{ref} (KJV)\n\n{verse_text}\n\n{story_text}\n\n"
                    "This is a fictional story written to illustrate the verse.\n"
                    "Subscribe to Quiet Hours of Faith and tap the bell for daily Psalms.\n\n"
                    "#Shorts #Psalms #Bible #Faith #Prayer #KJV #ChristianShorts")
            vid = upload(youtube, out, full_title, desc, slot)

            for v in items:
                if v["kind"] == "verse":
                    used.add(f"{v['ch']}:{v['v']}")
            schedule.append({"video_id": vid, "title": full_title, "publish_at": slot})
            save_json(USED_FILE, sorted(used))
            save_json(SCHEDULE_FILE, schedule)
        except Exception as e:
            failures += 1
            print(f"Short {i + 1} fail: {e}")

    if failures:
        sys.exit(1)


if __name__ == "__main__":
    main()
