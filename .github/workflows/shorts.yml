Quiet Hours of Faith - Shorts generator (v2)

Kia karta hai:
  1. Random Psalm chapter se KJV verses uthata hai
  2. Verses ek ek karke edge-tts se bolwata hai, aur tab tak naye verses jodta hai
     jab tak total video MIN..MAX seconds ke andar TARGET ke qareeb na pohanch jaye
  3. Pixabay se nature background video leta hai
  4. Aakhir mein SUBSCRIBE_OUTRO_SECONDS ka outro lagata hai:
     "Subscribe, Like, Share" text + Subscribe button + click animation + bell ring
  5. YouTube par private upload karta hai aur publishAt se schedule kar deta hai
"""

