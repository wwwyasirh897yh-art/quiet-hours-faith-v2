# --------------------------------------------------------------------------
# Chhote helpers
# --------------------------------------------------------------------------
def run(cmd):
    r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
    if r.returncode != 0:
        print(r.stderr[-3000:])
        raise RuntimeError("Command fail: " + " ".join(cmd[:4]))
    return r.stdout


def load_json(path, default):
    try:
        with open(path, "r", encoding="utf-8") as f:
            return json.load(f)
    except Exception:
        return default


def save_json(path, data):
    with open(path, "w", encoding="utf-8") as f:
        json.dump(data, f, indent=2, ensure_ascii=False)


def media_duration(path):
    out = run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "csv=p=0", path])
    return float(out.strip())


def clean_text(t):
    t = t.replace("\n", " ").replace("¶", "").replace("[", "").replace("]", "")
    return " ".join(t.split())


# --------------------------------------------------------------------------
# Verses
# --------------------------------------------------------------------------
def fetch_chapter(ch):
    url = f"https://bible-api.com/psalms+{ch}?translation=kjv"
    for _ in range(3):
        try:
            r = requests.get(url, timeout=30)
            if r.status_code == 200:
                verses = r.json().get("verses", [])
                return [{"ch": ch, "v": v["verse"], "text": clean_text(v["text"])} for v in verses]
        except Exception as e:
            print("Verse fetch error:", e)
    return []


def tts_to_file(text, path, rate=VOICE_RATE):
    async def _go():
        await edge_tts.Communicate(text, VOICE, rate=rate).save(path)
    asyncio.run(_go())


def pick_verses(verses, start_idx, used, outdir):
    """1-2 verses chunta hai (voice 8 se 18 sec). Baqi waqt story ke liye bachta hai."""
    chosen, voice_total = [], 0.0
    for v in verses[start_idx:]:
        key = f"{v['ch']}:{v['v']}"
        if key in used:
            break
        mp3 = os.path.join(outdir, f"v_{v['ch']}_{v['v']}.mp3")
        if not os.path.exists(mp3):
            tts_to_file(v["text"], mp3)
        dur = media_duration(mp3)
        if voice_total + dur > VERSE_VOICE_MAX:
            break
        chosen.append({**v, "mp3": mp3, "dur": dur, "kind": "verse",
                       "ref": f"Psalm {v['ch']}:{v['v']}", "gap": GAP_SEC})
        voice_total += dur + GAP_SEC
        if voice_total >= VERSE_VOICE_MIN:
            break
    if not chosen:
        return None, 0
    chosen[-1]["gap"] = STORY_GAP_SEC          # verse ke baad thora lamba waqfa
    voice_total += STORY_GAP_SEC - GAP_SEC
    return chosen, voice_total


