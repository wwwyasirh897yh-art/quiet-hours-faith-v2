name: Create Shorts for Quiet Hours of Faith

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'   # Roz ek dafa (Pakistan: subah 10:17), 4 Shorts bana kar schedule karta hai

permissions:
  contents: write

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib requests "moviepy==1.0.3" "pillow<10" "numpy<2"
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl

      - name: Create Shorts (with Subscribe outro), upload private, schedule public
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FAITH }}
          TOTAL_SHORTS: '4'
          # Publish ke waqt (UTC): USA Eastern subah 9, dopahar 1, shaam 5, raat 8
          SLOT_HOURS_UTC: '14,18,22,1'
          # Aakhri subscribe/bell wale hisse ki length (seconds, kam az kam 6)
          SUBSCRIBE_OUTRO_SECONDS: '6'
          # Poori Short ki taqreeban length (seconds), outro samet
          TARGET_SHORT_SECONDS: '25'
        run: python shorts_video.py

      - name: Save used verses and schedule
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_shorts.json schedule_shorts.json || true
          git commit -m "Update shorts tracking" || echo "Kuch change nahi"
          git push || echo "Push nahi hua"

      # Optional Telegram alert (secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="Quiet Hours of Faith: SHORTS workflow fail ho gaya"
          fi
