name: Create LONG Video for Quiet Hours of Faith

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Upload privacy'
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
      publish_at:
        description: 'Schedule time UTC (jaise 2026-11-10T17:00:00Z). Khali chhodo to upar wali privacy lagegi'
        required: false
        default: ''
  # Test pass hone ke baad yeh uncomment karo (Mon, Wed, Fri - UTC 09:00 = Pakistan 2 baje dopahar)
  # schedule:
  #   - cron: '7 9 * * 1,3,5'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl

      - name: Create long video and upload
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FAITH }}
          PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
          PUBLISH_AT: ${{ github.event.inputs.publish_at }}
          # Sirf cron runs par: is UTC ghante par khud schedule hoga (apna time batao). Manual test mein nahi lagta.
          LONG_SLOT_HOUR_UTC: ${{ github.event_name == 'schedule' && '16' || '' }}
        run: python long_video.py

      - name: Save used chapters list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_long.json || true
          git commit -m "Update used long chapters" || echo "Kuch change nahi"
          git push || echo "Push nahi hua"

      # Optional: Telegram alert (secrets TELEGRAM_BOT_TOKEN aur TELEGRAM_CHAT_ID add karo)
      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="Quiet Hours of Faith: LONG video workflow FAIL ho gaya"
          fi
