name: Token Test (30 second check)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install google-auth requests

      - name: Check refresh token
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_FAITH }}
        run: |
          python - <<'EOF'
          import os, json
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          raw = os.environ.get('CLIENT_SECRET_JSON', '')
          tok = os.environ.get('REFRESH_TOKEN', '')
          print('Client JSON length:', len(raw))
          print('Token length:', len(tok), '| starts with:', tok[:3],
                '| extra space/newline:', tok != tok.strip() or ' ' in tok.strip())
          sec = json.loads(raw)
          sec = sec.get('web') or sec.get('installed') or {}
          print('Client type:', 'web' if 'client_id' in sec else 'unknown')
          c = Credentials(None, refresh_token=tok.strip(),
                          token_uri='https://oauth2.googleapis.com/token',
                          client_id=sec.get('client_id'),
                          client_secret=sec.get('client_secret'),
                          scopes=['https://www.googleapis.com/auth/youtube.upload'])
          try:
              c.refresh(Request())
              print('RESULT: TOKEN OK - token aur client match karte hain')
          except Exception as e:
              print('RESULT: TOKEN FAIL -', e)
              raise SystemExit(1)
          EOF
